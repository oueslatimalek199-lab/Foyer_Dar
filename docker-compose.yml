services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]

  ia:
    build: ./foyer-dar-ia-service
    env_file: ./foyer-dar-ia-service/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/foyerdar

  backend:
    build: ./foyer-dar-backend
    env_file: ./foyer-dar-backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/foyerdar
      IA_SERVICE_URL: http://ia:8000
    depends_on: [mongo, ia]
    volumes: [uploads:/app/uploads]

  frontend:
    build: ./foyer-dar-frontend
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  mongo_data:
  uploads: